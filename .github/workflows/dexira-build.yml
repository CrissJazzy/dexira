name: DEXIRA build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/wordpress-published-content]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Astro production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DEXIRA
        run: npm run build
